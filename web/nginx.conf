# Everything on one origin: the app, the API and the socket. That's what makes
# the built PWA behave like the dev server, without CORS or absolute URLs.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router owns the paths — /r/ABC123 and /dashboard are not files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker must never be served stale, or updates never land.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8020/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://hub:8010/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A paired screen can sit idle for a long time between commands.
        proxy_read_timeout 1h;
    }
}
