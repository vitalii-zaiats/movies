# One origin for everything: the app, the API, the socket and the media.
#
# That keeps CORS out of the picture entirely and, more usefully, makes the
# whole stack reachable through a single tunnel — `ngrok http 80` and the phone
# on the other side gets the app, the pairing socket and the video.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router owns the paths — /r/ABC123 and /dashboard are not files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker must never be served stale, or updates never land.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8020/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Video. The VOD service builds its playlist links relative to the request,
    # so it doesn't care that it lives under a prefix here.
    location /vod/ {
        proxy_pass http://vod:8030/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # segments should flow, not pile up
        proxy_read_timeout 5m;
    }

    location /ws {
        proxy_pass http://hub:8010/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A paired screen can sit idle for a long time between commands.
        proxy_read_timeout 1h;
    }
}
