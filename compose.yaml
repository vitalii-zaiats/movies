# The whole stack behind one nginx on :80.
#
# Everything the browser touches — the app, /api, /ws and /vod — is one origin,
# which means no CORS to reason about and, more to the point, a single tunnel:
# `ngrok http 80` and the phone on the other side gets all of it.
#
#   docker compose up -d --build
#   docker compose run --rm seed data/family-guy-streams.jsonl
#
# Only nginx and the two databases publish ports; the services talk over the
# compose network by name.

# No `name:` on purpose — the project keeps the directory's name, so the
# postgres volume that already holds the catalogue stays the same one.

# One file per service, assembled here rather than run apart. `include` merges
# them into this single project, so a service still names its neighbours and
# still waits for them: the API waits for `migrate` to finish, `vod` for
# `vod-init`, `hub` for a healthy redis. Separate projects on a shared network
# would buy independent deploys and cost exactly those guarantees, which is a
# trade worth making deliberately and not by accident of file layout.
#
# `project_directory: .` is what keeps every path inside these files relative to
# the repository root — build contexts, dockerfiles, `./data` — the way they read
# when they all lived in one file. Without it they would resolve against
# `compose/`.
include:
  - path: compose/postgres.yaml
    project_directory: .
  - path: compose/redis.yaml
    project_directory: .
  - path: compose/proxy.yaml
    project_directory: .
  - path: compose/vod.yaml
    project_directory: .
  - path: compose/api.yaml
    project_directory: .
  - path: compose/hub.yaml
    project_directory: .
  - path: compose/web.yaml
    project_directory: .
  - path: compose/seed.yaml
    project_directory: .
  - path: compose/tunnel.yaml
    project_directory: .
