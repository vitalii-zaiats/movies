# What the pairing hub keeps its rooms in. Nothing here is worth persisting —
# a pairing outlives a page load, not a restart.

services:
  redis:
    image: redis:8-alpine
    container_name: testing-shit-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
