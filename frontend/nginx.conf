# One origin for everything: the app, the API, the media, the video and the
# socket.
#
# That keeps CORS out of the picture entirely and, more usefully, makes the
# whole stack reachable through a single tunnel — one address and the phone on
# the other side gets the catalogue and the video it points at.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects must never name this port. nginx listens on 8080, the host
    # publishes 80 and a tunnel publishes 443 — an absolute redirect built from
    # `listen` would send the browser to a port nothing answers on.
    absolute_redirect off;

    # Docker's own DNS, asked again every 10 seconds. Without this nginx
    # resolves each upstream once, at startup, and keeps that address forever —
    # so redeploying just the API, or anything that recreates its container,
    # leaves this serving 502 to a service that is up and healthy. The names
    # below are variables for the same reason: a literal `proxy_pass
    # http://api:8020` is resolved at config load, a variable one per request.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $api_upstream api:8020;
    set $vod_upstream vod:8030;
    set $hub_upstream hub:8010;

    # Nuxt's router owns the paths — /shows/family-guy and /watch/12 are not
    # files. `nuxt generate` prerenders the static ones into directories, so
    # `$uri/index.html` comes before `$uri/`: serving the file directly beats
    # redirecting to the trailing slash first. `200.html` is the fallback the
    # generator leaves for the routes it couldn't know about, with index.html
    # behind it in case a build ever stops emitting one.
    location / {
        try_files $uri $uri/index.html $uri/ /200.html /index.html;
    }

    # Hashed filenames, so they can never go stale.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # The rewrite does what the trailing slash of a literal `proxy_pass
        # http://api:8020/` used to: drop the prefix this location matched.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded banners. Its own prefix rather than a path under /api/ because
    # these are plain files with a hash for a name: immutable, cacheable
    # forever, and worth keeping out of the API's request log.
    location /media/ {
        # No URI after the host, so the path arrives unchanged — which is what
        # `http://api:8020/media/` meant here.
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The name is the SHA-256 of the content, so the bytes behind a URL can
        # never change. The API says the same thing; this repeats it for the
        # responses nginx serves out of its own cache.
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Video. The VOD service builds its playlist links relative to the request,
    # so it doesn't care that it lives under a prefix here.
    location /vod/ {
        rewrite ^/vod/(.*)$ /$1 break;
        proxy_pass http://$vod_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # segments should flow, not pile up
        proxy_read_timeout 5m;
    }

    # The pairing socket. Nothing in this app speaks it yet — the casting pair
    # lives in `web/` — but the prefix stays here so the stack keeps one door.
    location /ws {
        # The path is the same on both sides, so nothing is rewritten.
        proxy_pass http://$hub_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # A paired screen can sit idle for a long time between commands.
        proxy_read_timeout 1h;
    }
}
