[project]
name = "crawlers"
version = "0.1.0"
description = "Pluggable listing-page crawlers: sources in, sinks out"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpkit",
    "httpx>=0.28",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
]

[project.scripts]
crawl = "crawlers.cli:main"

[tool.uv.sources]
httpkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
