syntax = "proto3";

package vod.v1;

// The VOD service owns playable things. The only field that must exist is the
// playlist URL — an index.m3u8. Title, poster and the rest are metadata the API
// fills in when it has it, and null until then.
service VodService {
  rpc CreateVod(CreateVodRequest) returns (CreateVodResponse);
  rpc GetVod(GetVodRequest) returns (Vod);
  rpc ListVods(ListVodsRequest) returns (ListVodsResponse);
}

message Metadata {
  optional string title = 1;
  optional string poster = 2;
  // Everything else the registrar knew, as a JSON object.
  //
  // A blob rather than fields, because the VOD service does not read it: it
  // carries it so whoever catalogues these later doesn't have to go and find
  // the same facts a second time. A string map was tried and was the wrong
  // shape — genres are a list, a year is a number, and stringifying both to
  // fit the carrier means parsing them back on faith.
  string json = 3;
}

message Vod {
  uint64 id = 1;
  // Where the stream really lives, upstream.
  string playlist_url = 2;
  // Where we serve it: http://vod.localhost/1
  string url = 3;
  Metadata metadata = 4;
  string created_at = 5;
}

message CreateVodRequest {
  string playlist_url = 1;
  Metadata metadata = 2;
}

message CreateVodResponse {
  Vod vod = 1;
  // False when this playlist was already registered — create is idempotent, so
  // re-running a seed doesn't duplicate anything.
  bool created = 2;
}

message GetVodRequest {
  uint64 id = 1;
}

message ListVodsRequest {
  uint32 limit = 1;
  uint64 after_id = 2;
}

message ListVodsResponse {
  repeated Vod vods = 1;
}
