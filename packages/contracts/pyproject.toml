[project]
name = "contracts"
version = "0.1.0"
description = "gRPC contracts shared by the services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.68",
    "protobuf>=5.28",
]

[dependency-groups]
dev = ["grpcio-tools>=1.68"]

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
