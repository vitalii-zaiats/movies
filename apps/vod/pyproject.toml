[project]
name = "vod"
version = "0.1.0"
description = "VOD microservice — owns playlists, speaks gRPC, serves index.m3u8"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.115",
    "grpcio>=1.68",
    "httpx>=0.28",
    "uvicorn>=0.32",
]

[project.scripts]
vod = "vod.__main__:main"

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
