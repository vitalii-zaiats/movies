[project]
name = "seeder"
version = "0.1.0"
description = "Loads crawled episodes into the VOD service and the catalogue"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "grpcio>=1.68",
    "httpx>=0.28",
]

[project.scripts]
seed-catalogue = "seeder.__main__:main"

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
