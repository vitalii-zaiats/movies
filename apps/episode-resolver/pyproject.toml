[project]
name = "episode-resolver"
version = "0.1.0"
description = "Takes crawled episodes and resolves each one's ashdi streams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ashdi-finder",
    "crawlers",
    # The requester is this app's choice to make; the libraries take whatever
    # it hands them.
    "httpkit",
]

[project.scripts]
resolve-episodes = "episode_resolver.__main__:main"
resolve-crawl = "episode_resolver.crawl:main"

[tool.uv.sources]
ashdi-finder = { workspace = true }
crawlers = { workspace = true }
httpkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
